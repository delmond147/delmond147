name: Generate Profile Analytics

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  github-metrics:
    runs-on: ubuntu-latest

    steps:
      - name: Generate GitHub metrics dashboard
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}

          filename: assets/github-metrics.svg

          base: header, activity, community, repositories, metadata
          base_indepth: yes
          base_hireable: yes

          config_timezone: Africa/Douala
          config_order: base.header, base.activity, base.community, base.repositories, languages, habits, isocalendar, followup, topics

          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_sections: most-used, recently-used
          plugin_languages_details: bytes-size, percentage
          plugin_languages_colors: github
          plugin_languages_threshold: 0%

          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 14
          plugin_habits_charts: yes
          plugin_habits_facts: yes

          plugin_followup: yes
          plugin_followup_sections: repositories, user

          plugin_repositories: yes
          plugin_repositories_featured: 0
          plugin_repositories_pinned: 0
          plugin_repositories_starred: yes

          plugin_topics: yes
          plugin_topics_mode: starred
          plugin_topics_limit: 15
